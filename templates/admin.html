<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Панель администратора</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: rgba(18, 24, 38, 0.95);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f8fafc;
      --muted: #94a3b8;
      --green: #10b981;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .admin-card {
      width: 100%;
      max-width: 580px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }

    h1 {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .form-group {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
    }

    input[type="text"], input[type="password"] {
      background: #111827;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, input[type="password"]:focus {
      border-color: var(--accent);
    }

    .btn-submit {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background: var(--accent-hover);
    }

    .status-msg {
      margin-top: 14px;
      padding: 10px;
      border-radius: 10px;
      text-align: center;
      font-size: 13px;
      display: none;
    }
    .status-msg.success { background: rgba(16, 185, 129, 0.15); color: var(--green); border: 1px solid rgba(16, 185, 129, 0.3); }
    .status-msg.error { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }
  </style>
</head>
<body>
  <div class="admin-card">
    {% if not authenticated %}
      <h1>🔐 Вход в админ-панель</h1>
      <form action="/admin/login" method="POST">
        <div class="form-group">
          <label>Пароль администратора</label>
          <input type="password" name="password" placeholder="Введите пароль" required autofocus>
        </div>
        <button type="submit" class="btn-submit">Войти</button>
      </form>
    {% else %}
      <h1>⚙️ Редактирование витрины</h1>
      <form id="settings-form">
        <div class="form-group">
          <label>Заголовок магазина</label>
          <input type="text" id="title" value="{{ cfg.title }}" required>
        </div>
        <div class="form-group">
          <label>Подзаголовок (описание)</label>
          <input type="text" id="subtitle" value="{{ cfg.subtitle }}" required>
        </div>
        <div class="form-group">
          <label>Ссылка Telegram</label>
          <input type="text" id="telegram" value="{{ cfg.telegram }}">
        </div>
        <div class="form-group">
          <label>Ссылка FunPay</label>
          <input type="text" id="funpay" value="{{ cfg.funpay }}">
        </div>
        <div class="form-group">
          <label>Ссылка Instagram</label>
          <input type="text" id="instagram" value="{{ cfg.instagram }}">
        </div>
        <div class="form-group">
          <label>Контактный Email</label>
          <input type="text" id="email" value="{{ cfg.email }}">
        </div>
        <div class="form-group">
          <label>URL фонового изображения</label>
          <input type="text" id="bg_image" value="{{ cfg.bg_image }}" placeholder="https://example.com/bg.jpg">
        </div>
        <button type="submit" class="btn-submit">Сохранить изменения</button>
      </form>
      <div id="status-box" class="status-msg"></div>
    {% endif %}
  </div>

  {% if authenticated %}
  <script>
    document.getElementById("settings-form").onsubmit = async (e) => {
      e.preventDefault();
      const statusBox = document.getElementById("status-box");
      statusBox.style.display = "none";

      const payload = {
        title: document.getElementById("title").value,
        subtitle: document.getElementById("subtitle").value,
        telegram: document.getElementById("telegram").value,
        funpay: document.getElementById("funpay").value,
        instagram: document.getElementById("instagram").value,
        email: document.getElementById("email").value,
        bg_image: document.getElementById("bg_image").value
      };

      try {
        const res = await fetch("/admin/save", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (res.ok) {
          statusBox.className = "status-msg success";
          statusBox.textContent = data.message || "Настройки успешно сохранены!";
        } else {
          statusBox.className = "status-msg error";
          statusBox.textContent = data.detail || "Ошибка при сохранении";
        }
      } catch (err) {
        statusBox.className = "status-msg error";
        statusBox.textContent = "Сетевая ошибка";
      }
      statusBox.style.display = "block";
    };
  </script>
  {% endif %}
</body>
</html>
